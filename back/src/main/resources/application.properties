spring.application.name=login-general-back
server.port=8085
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Credenciales: se leen de application-local.properties (no versionado) o de variables de entorno.
spring.config.import=optional:classpath:application-local.properties

# Frontends autorizados para consumir la API, incluidos dominios temporales de ngrok.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.io,https://ventas.makiro.com.bo,http://ventas.makiro.com.bo,https://ventas.makiro.com.bo:*,http://ventas.makiro.com.bo:*,https://181.188.148.59,http://181.188.148.59,https://181.188.148.59:*,http://181.188.148.59:*

# Base central que contiene dbo.tbl_Sucursal.
spring.datasource.url=jdbc:jtds:sqlserver://181.188.148.58:1433/BDFacturasPreV;ssl=off;loginTimeout=15;socketTimeout=30
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-test-query=SELECT 1

# Credenciales comunes para las bases indicadas por dbo.tbl_Sucursal.
app.sucursal.datasource.username=${SUCURSAL_DB_USERNAME:}
app.sucursal.datasource.password=${SUCURSAL_DB_PASSWORD:}
app.sucursal.datasource.params=ssl=off;loginTimeout=15;socketTimeout=30

# JWT HS256. La clave debe representar al menos 32 bytes en Base64.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=8

# Timeout (segundos) para validar/finalizar/aprobar cuadres, que recorren miles de productos.
app.sucursal.datasource.cuadre-socket-timeout-seconds=300
