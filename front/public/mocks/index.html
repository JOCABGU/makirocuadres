<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identidades · Sistema Almacén</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f6;--surface:#fff;--border:#dfe3e8;--text:#111827;--muted:#6b7280;--active:#111827;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'DM Sans',system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{margin:0;font-size:1rem;font-weight:700}
header p{margin:0;color:var(--muted);font-size:.8rem}
.seg{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.seg button{padding:6px 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:600 .78rem 'DM Sans';cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
main{padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{overflow:hidden;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 10px 28px rgba(17,24,39,.12);transform:translateY(-2px)}
.frame{position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--border);background:var(--bg)}
.frame iframe{position:absolute;top:0;left:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.frame a{position:absolute;inset:0}
.meta{display:flex;align-items:center;gap:12px;padding:12px 14px}
.meta b{font-size:.9rem}
.meta span{display:block;color:var(--muted);font-size:.74rem}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--bg);font-weight:700;font-size:.75rem}
.open{margin-left:auto;padding:6px 10px;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.74rem;font-weight:600;text-decoration:none}
.open:hover{background:var(--active);color:#fff;border-color:var(--active)}
.single{display:none;height:calc(100vh - 140px);min-height:480px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.single iframe{width:100%;height:100%;border:0}
.tabs{display:none;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{padding:7px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font:600 .76rem 'DM Sans';cursor:pointer}
.tabs button.on{background:var(--active);border-color:var(--active);color:#fff}
body.mode-single .grid{display:none}
body.mode-single .single{display:block}
body.mode-single .tabs{display:flex}
@media(max-width:600px){header{padding:12px 16px}main{padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>Sistema Almacén: 8 identidades</h1><p>Mismo sistema, 8 estilos empresariales distintos.</p></div>
  <div class="spacer"></div>
  <div class="seg" id="view"><button data-v="login">Login</button><button data-v="almacen" class="on">Almacén</button><button data-v="tecnico">Técnico</button></div>
  <div class="seg" id="mode"><button data-m="grid" class="on">Cuadrícula</button><button data-m="single">Comparar</button></div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="single"><iframe id="big" title="Vista ampliada"></iframe></div>
</main>
<script>
const MOCKS=[
  ['01-andino-corporativo','Andino Corporativo','Formulario oficial y sello · IBM Plex · navy y cobre'],
  ['02-banca-esmeralda','Banca Esmeralda','Libro mayor · Source Serif 4 · verde y dorado'],
  ['03-grafito-ambar','Grafito Ámbar','Etiqueta de almacén y ticket térmico · Archivo · grafito y ámbar'],
  ['04-azul-institucional','Azul Institucional','Rutas como líneas de transporte · Public Sans · azul'],
  ['05-borgona-ejecutivo','Borgoña Ejecutivo','Informe membretado · Fraunces · borgoña'],
  ['06-petroleo-moderno','Petróleo Moderno','Tarjeta SIM · Plus Jakarta Sans · petróleo'],
  ['07-indigo-corporativo','Índigo Corporativo','Tablero de despacho split-flap · Sora · índigo'],
  ['08-altiplano-terracota','Altiplano Terracota','Franjas de aguayo como código · Bricolage Grotesque · terracota'],
];
let view='almacen',current=0;
const grid=document.getElementById('grid'),tabs=document.getElementById('tabs'),big=document.getElementById('big');
const url=f=>`${f}.html#${view}`;
grid.innerHTML=MOCKS.map(([f,n,d],i)=>`
  <article class="card">
    <div class="frame"><iframe loading="lazy" data-f="${f}" title="${n}"></iframe><a href="#" data-i="${i}" aria-label="Comparar ${n}"></a></div>
    <div class="meta"><div class="num">${String(i+1).padStart(2,'0')}</div><div><b>${n}</b><span>${d}</span></div><a class="open" data-f="${f}" target="_blank">Abrir ↗</a></div>
  </article>`).join('');
tabs.innerHTML=MOCKS.map(([,n],i)=>`<button data-i="${i}">${String(i+1).padStart(2,'0')} · ${n}</button>`).join('');
function scale(){document.querySelectorAll('.frame').forEach(fr=>{fr.firstElementChild.style.transform=`scale(${fr.clientWidth/1440})`})}
function render(){
  grid.querySelectorAll('iframe').forEach(ifr=>{ifr.src=url(ifr.dataset.f)});
  grid.querySelectorAll('.open').forEach(a=>{a.href=url(a.dataset.f)});
  big.src=url(MOCKS[current][0]);
  tabs.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===current));
}
function setMode(m){document.body.classList.toggle('mode-single',m==='single');document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
document.getElementById('view').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#view button').forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('mode').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;current=+b.dataset.i;render()};
grid.onclick=e=>{const a=e.target.closest('a[data-i]');if(!a)return;e.preventDefault();current=+a.dataset.i;setMode('single');render()};
addEventListener('keydown',e=>{if(!document.body.classList.contains('mode-single'))return;if(e.key==='ArrowRight'){current=(current+1)%MOCKS.length;render()}if(e.key==='ArrowLeft'){current=(current+MOCKS.length-1)%MOCKS.length;render()}});
addEventListener('resize',scale);
render();scale();
</script>
</body>
</html>
